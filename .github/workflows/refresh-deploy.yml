name: Refresh crash data and deploy

on:
  schedule:
    # Daily, 11:23 UTC (early morning in Chicago).
    - cron: '23 11 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      # Pushes rebuild from the committed snapshots; scheduled and manual
      # runs fetch fresh data first.
      - name: Fetch upstream data
        if: github.event_name != 'push'
        run: npm run data:fetch
      - name: Build data (verifies against the Village's published totals)
        run: npm run data:build
      - run: npm run check
      - run: npm run test
      - run: npm run build
      - name: Commit refreshed data
        if: github.event_name != 'push'
        working-directory: .
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data dashboard/public/data
          # Every fetch stamps a new fetch time; only commit when the data
          # itself changed.
          if ! git diff --cached --quiet -I'"(fetchedAt|generatedAt)"'; then
            git commit -m "Refresh crash data ($(date -u +%Y-%m-%d))"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
